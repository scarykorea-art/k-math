<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="utf-8">
<style>
  * { box-sizing: border-box; min-width: 0; }
  body { font-family: 'Malgun Gothic', -apple-system, sans-serif; background: #f1f5f9; margin: 0; padding: 12px; color: #1e293b; font-size: 15px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 3px 14px rgba(0,0,0,.06); padding: 18px; margin-bottom: 12px; }
  h2 { margin: 0 0 4px; font-size: 20px; text-align: center; } h3 { margin: 0 0 10px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  h3 small { font-size: 12px; font-weight: 400; color: #64748b; }
  .sub { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 16px; }
  input { width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 16px; margin-bottom: 9px; }
  input:focus { outline: none; border-color: #2563eb; }
  .pw-wrap { position: relative; } .pw-wrap button { position: absolute; right: 8px; top: 7px; background: none; border: none; color: #64748b; font-size: 13px; padding: 6px; cursor: pointer; }
  .btn { width: 100%; padding: 14px; background: #2563eb; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn:disabled { opacity: .5; }
  .mute { color: #64748b; font-size: 13px; }
  .err { color: #dc2626; background: #fef2f2; border: 1px solid #fecaca; padding: 13px; border-radius: 10px; text-align: center; font-size: 14px; }
  .hero { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .total { background: #2563eb; color: #fff; padding: 6px 14px; border-radius: 20px; font-weight: 800; }
  .miss { border-left: 5px solid #dc2626; }
  .mrow { display: flex; justify-content: space-between; gap: 8px; padding: 10px 0; border-bottom: 1px dashed #e2e8f0; align-items: center; }
  .mrow:last-child { border-bottom: none; }
  .tag { font-size: 12px; padding: 3px 9px; border-radius: 12px; font-weight: 700; white-space: nowrap; }
  .t-red { background: #fee2e2; color: #b91c1c; } .t-yel { background: #fef3c7; color: #92400e; } .t-grn { background: #dcfce7; color: #166534; } .t-gry { background: #f1f5f9; color: #64748b; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 6px; text-align: center; }
  .box .l { font-size: 12px; color: #64748b; } .box .v { font-size: 20px; font-weight: 800; color: #1e40af; } .box .v small { font-size: 12px; color: #94a3b8; font-weight: 400; }
  .goal { background: #eff6ff; border-radius: 12px; padding: 12px; margin-top: 10px; font-size: 14px; line-height: 1.6; }
  .bar { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin: 4px 0 8px; } .bar i { display: block; height: 100%; background: #2563eb; }
  .unit { border: 1px solid #e2e8f0; border-radius: 12px; padding: 11px; margin-bottom: 8px; }
  .uh { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; margin-bottom: 7px; gap: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 5px 9px; border-radius: 7px; }
  .c-ok { background: #dcfce7; color: #166534; } .c-late { background: #fef3c7; color: #92400e; } .c-miss { background: #fee2e2; color: #991b1b; font-weight: 700; } .c-wait { background: #f1f5f9; color: #94a3b8; }
  .notice { border-left: 4px solid #2563eb; background: #f8fafc; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; white-space: pre-wrap; word-break: keep-all; }
  .notice.future { border-color: #16a34a; }
  .rules { font-size: 13px; color: #475569; line-height: 1.7; background: #f8fafc; border-radius: 10px; padding: 10px 12px; }
  .seteuk { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 16px; font-size: 14px; line-height: 1.75; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
  .again { display: block; margin: 6px auto 0; background: none; border: none; color: #2563eb; font-size: 14px; cursor: pointer; }
  .foot { text-align: center; font-size: 12px; color: #94a3b8; margin: 14px 0; } .foot a { color: #64748b; }
  .guide details { border-top: 1px dashed #e2e8f0; padding: 8px 0; } .guide summary { font-weight: 700; font-size: 14px; cursor: pointer; padding: 4px 0; }
  .guide ul { margin: 6px 0 2px; padding-left: 20px; font-size: 14px; line-height: 1.7; color: #334155; } .guide li { margin: 2px 0; word-break: keep-all; }
  .tap { cursor: pointer; border-color: #93c5fd; } .tap:active { background: #eff6ff; } .box .hint { font-size: 11px; color: #64748b; margin-top: 2px; }
  .pb { margin-top: 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; } .pb table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .pb td { padding: 6px 2px; border-bottom: 1px dashed #e2e8f0; } .pb td:last-child { text-align: right; font-weight: 700; white-space: nowrap; } .pb .neg { color: #b91c1c; } .pb tr.sum td { border-bottom: none; border-top: 2px solid #cbd5e1; font-weight: 800; color: #1e40af; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="form">
    <h2>📐 수행평가 · 세특 조회</h2>
    <div class="sub">학번과 받은 <b>1차 비밀번호</b>(대소문자 구분)를 입력하세요.</div>
    <input id="sid" placeholder="학번 (예: 20602)" inputmode="numeric" maxlength="5" autocomplete="off">
    <div class="pw-wrap"><input type="password" id="spw" placeholder="1차 비밀번호" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" id="tg">보기</button></div>
    <button class="btn" id="go">내 기록 보기</button>
  </div>
  <div id="out"></div>
  <div class="foot"><a href="./" target="_top">새로고침</a> · 화면 v7</div>
</div>
<script>
// ── GitHub Pages용: google.script.run 대신 Apps Script(doPost)에 직접 요청 ──
window.K_API = "https://script.google.com/macros/s/AKfycbx7qXAz1wtloSsjqx3fTTIPi9GUXDKJZ9tsfLvEjrCf7Yj-fFZUG_pYFP4qLbrdTu2H0Q/exec";
window.google = { script: {
  run: (function () {
    function mk(ok, fail) {
      return new Proxy({}, { get(_, k) {
        if (k === 'withSuccessHandler') return h => mk(h, fail);
        if (k === 'withFailureHandler') return h => mk(ok, h);
        if (k === 'withUserObject') return () => mk(ok, fail);
        return (...args) => {
          fetch(window.K_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: k, args }) })
            .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
            .then(t => ok && ok(t), e => fail && fail(e));
        };
      } });
    }
    return new Proxy({}, { get(_, k) { return mk(null, null)[k]; } });
  })(),
  url: { getLocation(cb) { const p = {}; new URLSearchParams(location.search).forEach((v, k) => p[k] = v); cb({ parameter: p, hash: location.hash.slice(1) }); } }
} };
</script>
<script>
{
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const md = d => { const [y, m, dd] = d.split('-'); return `${+m}/${+dd}(${DOW[new Date(+y, m - 1, +dd).getDay()]})`; };
let busy = false, ME = null;

function run(fn, args, ok, fail) {
  let fin = false;
  const t = setTimeout(() => { if (fin) return; fin = true; fail('응답이 너무 늦어요. 잠시 후 다시 해 주세요.'); }, 25000);
  const end = cb => (...a) => { if (fin) return; fin = true; clearTimeout(t); cb(...a); };
  google.script.run
    .withSuccessHandler(end(s => { let r; try { r = JSON.parse(s); } catch (e) { return fail('응답을 읽지 못했어요.'); } r.success ? ok(r) : fail(r.message); }))
    .withFailureHandler(end(() => fail('서버 오류가 났어요. 잠시 후 다시 해 주세요.')))[fn](...args);
}
const errCard = m => `<div class="card"><div class="err">${esc(m)}</div></div>`;

function go() {
  if (busy) return;
  const id = $('sid').value.trim(), pw = $('spw').value;
  if (!id || !pw) { $('out').innerHTML = errCard('학번과 비밀번호를 입력해 주세요.'); return; }
  busy = true; $('go').disabled = true; $('out').innerHTML = '<div class="card mute" style="text-align:center">불러오는 중…</div>';
  run('getStudentInfo', [id, pw], r => {
    busy = false; $('go').disabled = false; $('spw').value = '';
    ME = { id }; $('form').style.display = 'none';
    $('out').innerHTML = view(r); window.scrollTo(0, 0);
  }, m => { busy = false; $('go').disabled = false; $('out').innerHTML = errCard(m); });
}

function gradeInfo(th, val) {
  if (!th || !th.length) return null;
  const cur = th.find(t => val >= t.min) || th[th.length - 1];
  const i = th.indexOf(cur), next = i > 0 ? th[i - 1] : null;
  return { score: cur.score, next, need: next ? Math.ceil(next.min - val) : 0, top: th[0] };
}

function view(r) {
  const d = r.detail;
  let h = '';
  if (!d) return (r.detailMsg ? errCard(r.detailMsg) : '') + seteukCard(r) + again();
  const open = r.scoreOpen === true && !!d.finalScores;   // 영역 점수는 수행 끝나고 공개 (웹앱설정 '점수공개')
  const f = d.finalScores, q = d.quant;
  h += `<div class="card"><div class="hero"><b style="font-size:19px">🎓 ${esc(r.id)} ${esc(r.name)}</b>${open ? `<span class="total">총점 ${f.total} / 50</span>` : ''}</div></div>`;

  // 1. 안 낸 과제
  const miss = d.missing.filter(m => !m.closed), closed = d.missing.filter(m => m.closed);
  h += `<div class="card ${miss.length ? 'miss' : ''}"><h3>${miss.length ? `🚨 지금 낼 수 있는 과제 ${miss.length}개` : '✅ 낼 수 있는 과제는 다 냈어요'}</h3>`;
  h += miss.map(m => `<div class="mrow"><span><b>${esc(m.unit)} · ${esc(m.name)}</b><br><span class="mute">${m.deadline ? '마감 ' + esc(m.deadline) : '다음 단원 검사하는 날 수업 끝나면 마감'}</span></span>
    <span class="tag ${m.nextLevel ? 't-yel' : 't-grn'}">${m.nextLevel == null ? '' : (m.nextLevel ? `다음 수업 ${m.nextLevel}차 · 참여 ${m.nextPen}점` : '다음 수업 정시')}</span></div>`).join('');
  if (closed.length) h += `<div class="mute" style="margin-top:8px">마감돼서 못 내는 과제: ${closed.map(m => esc(m.name)).join(', ')}</div>`;
  h += `<div class="mute" style="margin-top:8px">검사는 <b>수학 수업이 있는 날, 수업 시작할 때만</b> 해요. 쉬는시간·수업 없는 날·교무실로 찾아와서 검사받기는 <b>모두 안 돼요.</b><br>늦게 내면 늦은 수업 수만큼 <b>참여 점수</b>에서 빠져요 (1번 늦으면 -1, 2번 늦으면 -2 …). 과제 개수는 그대로 인정돼요.</div></div>`;

  // 2. 공지·진도
  if (r.notices.length) h += `<div class="card"><h3>📢 수업 공지·진도</h3>${r.notices.map(n => `<div class="notice ${n.future ? 'future' : ''}"><b>${md(n.date)} ${esc(n.period)}교시${n.future ? ' (예정)' : ''}</b>${n.progress ? `\n진도: ${esc(n.progress)}` : ''}${n.notice ? `\n${esc(n.notice)}` : ''}</div>`).join('')}</div>`;

  // 3. 점수 + 만점까지
  const th = open && r.thresholds ? r.thresholds : {};
  const gc = gradeInfo(th.comm, q.partSum), gp = gradeInfo(th.prob, q.hwSum);
  if (open) {
    h += `<div class="card"><h3>🏆 영역 점수</h3><div class="grid3">
    <div class="box"><div class="l">발표·의사소통</div><div class="v">${f.comm}<small>/20</small></div></div>
    <div class="box"><div class="l">문제 해결</div><div class="v">${f.prob}<small>/20</small></div></div>
    <div class="box"><div class="l">독서·창의 사고</div><div class="v">${f.read}<small>/10</small></div></div></div>`;
  } else {
    const hwT = d.hwUnits.flatMap(u => u.tasks).filter(t => t.category === '과제');
    const hwChecked = hwT.filter(t => t.checked != null ? t.checked : (t.done || t.started)).length;
    const pb = d.partBreak, sg = n => (n > 0 ? '+' : '') + n;
    let rows = `<tr><td>🎤 발표 ${q.presCount}문제 × 5</td><td>${sg(q.presScore5)}</td></tr>`;
    if (pb) {
      const etc = Math.round((q.otherSum - pb.kyoScore - pb.late - pb.bonus - pb.toilet) * 100) / 100;
      rows += `<tr><td>📗 교과서 ${pb.kyo}개 × 9</td><td>${sg(pb.kyoScore)}</td></tr>
        <tr><td>🌟 경청·보너스</td><td>${sg(pb.bonus)}</td></tr>
        <tr><td>⏰ 늦게 낸 과제 감점</td><td class="${pb.late < 0 ? 'neg' : ''}">${sg(pb.late)}</td></tr>
        <tr><td>🚻 수업 중 화장실 감점</td><td class="${pb.toilet < 0 ? 'neg' : ''}">${sg(pb.toilet)}</td></tr>
        ${etc ? `<tr><td>✏️ 선생님 조정</td><td>${sg(etc)}</td></tr>` : ''}`;
    } else rows += `<tr><td>📗 교과서·경청 선물·감점</td><td>${sg(q.otherSum)}</td></tr>`;
    rows += `<tr class="sum"><td>참여 점수 합계</td><td>${q.partSum}</td></tr>`;
    h += `<div class="card"><h3>📈 지금까지 모은 점수 <small>영역 점수는 수행평가가 끝나면 공개해요</small></h3><div class="grid3" style="grid-template-columns:repeat(2,1fr)">
    <div class="box tap" id="pbBox" role="button" tabindex="0"><div class="l">참여 점수</div><div class="v">${q.partSum}<small>점</small></div><div class="hint">눌러서 세부내역 ▾</div></div>
    <div class="box"><div class="l">과제 (중·대·DM)</div><div class="v">${q.hwSum}<small> / ${hwChecked}개</small></div><div class="hint">검사한 ${hwChecked}개 중 ${q.hwSum}개 냄</div></div></div>
    <div id="pbTbl" class="pb" hidden><table>${rows}</table><div class="mute" style="margin-top:6px">감점은 모두 참여 점수에서 빠져요. 과제 개수는 늦게 내도 그대로예요.</div></div>
    <div class="mute" style="margin-top:8px">👉 <b>매 수업 발표하고 과제를 제때 내면</b> 점수가 쑥쑥 올라가요.</div>
    ${r.priority ? '<div style="margin-top:6px"><span class="tag t-yel">⭐ 발표 우선권 ' + r.priority + '번</span></div>' : ''}`;
  }
  if (gc) h += `<div class="goal"><b>발표·의사소통</b> — 참여 점수 ${q.partSum}점${gc.next ? ` · <b>${gc.need}점</b> 더 모으면 <b>${gc.next.score}점</b> (발표 약 ${Math.ceil(gc.need / 5)}번)` : ' · 최고 구간이에요 👍'}
    <div class="bar"><i style="width:${Math.max(0, Math.min(100, q.partSum / gc.top.min * 100))}%"></i></div>
    <span class="mute">참여 = 발표 ${q.presCount}번×5 (${q.presScore5}) + 교과서·경청·감점 (${q.otherSum}) · 만점 구간 ${gc.top.min}점 이상<br>👉 <b>매 수업 발표하면 만점</b>이에요. 지원했는데 문제가 모자라 못 하면 수학부장이 적어 두고 다음 발표 때 먼저 시켜 줘요. (하루 최대 2문제)</span>
    ${r.priority ? '<br><span class="tag t-yel">⭐ 발표 우선권 ' + r.priority + '번</span>' : ''}</div>`;
  if (gp) h += `<div class="goal"><b>문제 해결</b> — 과제 ${q.hwSum}개${gp.next ? ` · 과제 <b>${gp.need}개</b> 더 내면 <b>${gp.next.score}점</b>` : ' · 최고 구간이에요 👍'}
    <div class="bar"><i style="width:${Math.max(0, Math.min(100, q.hwSum / gp.top.min * 100))}%"></i></div><span class="mute">중·대·DM 1개 = 1점 · 만점 구간 ${gp.top.min}개 이상</span></div>`;
  h += `</div>`;

  // 4. 과제 현황
  h += `<div class="card"><h3>📚 과제 현황 <small>미제출 ${d.totalMissing} · 늦게 내서 참여 점수 ${d.totalPenalty}</small></h3>`;
  h += d.hwUnits.map(u => `<div class="unit"><div class="uh"><span>📘 ${esc(u.unit)}</span>${u.penalty < 0 ? `<span class="tag t-red">참여 감점 ${u.penalty}</span>` : '<span class="tag t-grn">감점 없음</span>'}</div><div class="chips">${u.tasks.map(t => {
    if (t.done) return `<span class="chip ${t.late ? 'c-late' : 'c-ok'}">✓ ${esc(t.name)}${t.late ? ` ${t.late}차` : ''}</span>`;
    if (t.started) return `<span class="chip c-miss">✕ ${esc(t.name)}${t.closed ? ' (마감)' : ''}</span>`;
    return `<span class="chip c-wait">${esc(t.name)} 검사 전</span>`;
  }).join('')}</div></div>`).join('');
  h += `<div class="rules">• <b>교(교과서)</b> 1개 = 참여 9점 · <b>중·대·DM</b> 1개 = 과제 1개<br>• <b>감점은 모두 참여 점수에서 빠져요.</b> 늦게 내도 과제 1개는 그대로 인정되고, 교과서 9점도 그대로 받아요. 대신 늦은 만큼 참여 점수가 깎여요.<br>• N번 늦게(N차) 내면 <b>참여 -N점</b> · 한 과제에서 빠지는 건 최대 교과서 -${r.capKyo}, 중·대·DM -${r.capHw}까지예요<br>• 다음 중단원 검사하는 날 그 수업이 끝나면 마감 (그 뒤엔 낼 수 없어요)<br>• 인정·질병 결석한 수업은 늦은 횟수에서 빠져요</div></div>`;

  // 5. 발표·경청
  h += `<div class="card"><h3>🎤 발표 ${d.presentations.length}번 <small>경청·보너스 +${d.totalBonus}</small></h3>
    ${d.presentations.length ? `<div class="chips">${d.presentations.map(p => `<span class="chip c-ok">${esc(p.unit)} ${esc(p.problem)}</span>`).join('')}</div>` : '<span class="mute">아직 발표 기록이 없어요.</span>'}
    ${d.bonusList.length ? `<div class="chips" style="margin-top:8px">${d.bonusList.map(b => `<span class="chip c-late">🌟 ${esc(b.unit)} +${b.score}</span>`).join('')}</div>` : ''}
    <div class="rules" style="margin-top:10px">• 발표 1문제 = +5점 (하루 최대 2문제)<br>• 친구 발표 뒤 퀴즈를 맞히면 <b>나에게</b> 경청 선물 +1점 (한 수업 최대 2점)<br>• 수업 중 특별히 잘하면 선생님 보너스 +1~+5</div></div>`;

  // 6. 화장실
  h += `<div class="card"><h3>🚻 수업 중 화장실 <small>${r.toiletCount}번 · ${d.toilet || 0}점</small></h3>
    <div class="rules">• 수업 중 화장실은 학기 동안 <b>N번째에 -N점</b> (한 번에 최대 -${r.capToilet}점)<br>• <b>몸이 아프거나 질병 때문에 화장실을 자주 가야 하면 꼭 미리 선생님께 말하세요.</b> 미리 말한 경우는 감점 안 해요.</div></div>`;

  h += seteukCard(r) + guide(r) + again();
  return h;
}
function seteukCard(r) {
  if (!r.seteukOpen) return `<div class="card"><h3>📝 세부능력 및 특기사항</h3><span class="mute">세특은 학기 말에 2차 비밀번호로 공개해요.</span></div>`;
  return `<div class="card" id="setCard"><h3>📝 세부능력 및 특기사항</h3><div class="mute" style="margin-bottom:8px">선생님께 받은 <b>2차 비밀번호</b>를 입력하세요.</div>
    <input type="password" id="pw2" placeholder="2차 비밀번호" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" id="go2">세특 보기</button><div id="setOut"></div></div>`;
}
const guide = r => `<div class="card guide"><h3>📖 우리 수학 수업은 이렇게 해요</h3>
  <details open><summary>✏️ 과제 검사</summary><ul>
    <li>과제는 <b>교(교과서) · 중단원 · 대단원 · DM</b>이 있어요.</li>
    <li>검사는 <b>수학 수업이 있는 날, 수업이 시작할 때만</b> 해요. 쉬는시간, 수업 없는 날, 교무실로 찾아와서 검사받는 건 <b>모두 안 돼요.</b></li>
    <li>선생님이 처음 검사하는 수업이 <b>정시</b>예요. 그때 내면 감점 없이 다 받아요.</li>
  </ul></details>
  <details><summary>⏰ 늦게 냈을 때</summary><ul>
    <li>정시 다음 수업에 내면 1차(-1), 그다음 수업이면 2차(-2) … <b>늦은 수업 수만큼 참여 점수가 깎여요.</b></li>
    <li>과제 점수는 안 깎여요. 늦게 내도 과제 1개는 그대로 인정돼요.</li>
    <li>한 과제에서 깎이는 건 최대 교과서 -${r.capKyo}, 중·대·DM -${r.capHw}까지예요.</li>
    <li><b>마감</b>은 다음 중단원 과제를 검사하는 날 그 수업이 끝날 때예요. 그 뒤엔 낼 수 없어요.</li>
    <li>휴일·행사 등으로 수업을 안 한 날, 내가 인정·질병 결석한 수업은 늦은 횟수에 안 들어가요. 정시날 인정·질병 결석했다면 다음 수업이 정시예요.</li>
  </ul></details>
  <details><summary>🎤 발표 · 경청</summary><ul>
    <li>발표 1문제 = 참여 +5점, 하루 최대 2문제까지 할 수 있어요.</li>
    <li>지원했는데 문제가 모자라 못 했으면 수학부장이 이름을 적어 두고, 다음 발표 때 먼저 기회를 줘요.</li>
    <li>친구 발표 뒤 퀴즈를 맞히면 경청 선물 +1점 (한 수업 최대 2점).</li>
  </ul></details>
  <details><summary>🚻 수업 중 화장실</summary><ul>
    <li>학기 동안 N번째로 가면 참여 -N점 (한 번에 최대 -${r.capToilet}점), 학기 내내 쌓여요.</li>
    <li>아프거나 질병 때문에 자주 가야 하면 <b>꼭 미리</b> 선생님께 말하세요. 미리 말하면 감점 안 해요.</li>
  </ul></details>
  <details><summary>🏆 점수 · 세특 공개</summary><ul>
    <li>영역 점수(발표·의사소통, 문제 해결, 독서·창의 사고)는 수행평가가 끝나면 공개해요.</li>
    <li>세특은 학기 말에 <b>2차 비밀번호</b>로 공개해요. 지금은 1차 비밀번호로 기록만 볼 수 있어요.</li>
    <li>이 페이지는 수시로 들어와서 확인하세요. 특히 맨 위 <b>🚨 지금 낼 수 있는 과제</b>는 꼭 챙기세요!</li>
  </ul></details></div>`;
const again = () => `<button class="again" id="again">← 다른 학번으로 조회</button>`;

function seteuk() {
  const pw2 = $('pw2').value; if (!pw2) return;
  $('go2').disabled = true; $('setOut').innerHTML = '<p class="mute">불러오는 중…</p>';
  run('getSeteuk', [ME.id, pw2], r => {
    $('setCard').innerHTML = `<h3>📝 세부능력 및 특기사항 <span class="tag ${r.label === '완성본' ? 't-grn' : 't-gry'}">${esc(r.label || '')}</span></h3>` +
      (r.seteuk ? `<div class="seteuk">${esc(r.seteuk)}</div>` : '<span class="mute">아직 작성된 세특이 없어요.</span>') +
      (r.label && r.label !== '완성본' ? '<p class="mute">확정 전 내용이라 바뀔 수 있어요.</p>' : '');
  }, m => { $('go2').disabled = false; $('setOut').innerHTML = `<div class="err" style="margin-top:8px">${esc(m)}</div>`; });
}

/* 교사용에서 '학생 화면 보기'로 열렸을 때 (?preview=학번): 교사 로그인으로 그 학생 화면을 그대로 */
function preview(id) {
  $('form').style.display = 'none';
  let tok = ''; try { tok = sessionStorage.getItem('k_tok') || localStorage.getItem('k_keep') || ''; } catch (e) {}
  if (!tok) { $('out').innerHTML = errCard('교사용 페이지에서 로그인한 같은 기기·브라우저에서만 볼 수 있어요.'); return; }
  $('out').innerHTML = '<div class="card mute" style="text-align:center">불러오는 중…</div>';
  run('adminStudentView', [tok, id], r => {
    ME = { id };
    $('out').innerHTML = `<div class="card" style="background:#fef9c3;border:1px solid #fde047;padding:10px 14px;font-size:13px">👀 <b>교사 미리보기</b> — ${esc(r.id)} ${esc(r.name)} 학생에게 보이는 화면 그대로예요.</div>` + view(r).replace(again(), '');
  }, m => { $('out').innerHTML = errCard(m); });
}
try { google.script.url.getLocation(loc => { const pv = loc && loc.parameter && loc.parameter.preview; if (pv) preview(String(pv)); }); } catch (e) {}

$('go').onclick = go;
$('tg').onclick = () => { const p = $('spw'), s = p.type === 'password'; p.type = s ? 'text' : 'password'; $('tg').textContent = s ? '숨김' : '보기'; };
['sid', 'spw'].forEach(i => $(i).addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));
document.addEventListener('click', e => {
  if (e.target.id === 'again') { $('out').innerHTML = ''; $('form').style.display = 'block'; ME = null; }
  if (e.target.id === 'go2') seteuk();
  const pbb = e.target.closest && e.target.closest('#pbBox'); if (pbb) { const t = $('pbTbl'); t.hidden = !t.hidden; pbb.querySelector('.hint').textContent = t.hidden ? '눌러서 세부내역 ▾' : '세부내역 접기 ▴'; }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pw2') seteuk(); if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'pbBox') { e.preventDefault(); e.target.click(); } });
}
</script>
</body>
</html>
